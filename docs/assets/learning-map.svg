<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Sand to GPU: the learning journey</title>
<desc id="desc">Five connected stages: materials, wafers, devices, packages, and systems. Follow ten survey chapters or explore twenty-two deep-dive modules.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#172c35"/></linearGradient>
  <linearGradient id="wafer" x2="1" y2="1"><stop stop-color="#62c9c1"/><stop offset="1" stop-color="#336b99"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d3e9f1" stroke-opacity=".035"/></pattern>
  <clipPath id="wafer-cut"><path d="M374 190a52 52 0 1 0 0 104a52 52 0 1 0 0-104"/></clipPath>
  <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l6 3-6 3" fill="none" stroke="#8da7b2"/></marker>
</defs>
<rect width="1200" height="460" rx="20" fill="url(#bg)"/>
<rect width="1200" height="460" rx="20" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="50" y="48" font-size="12" font-weight="700" letter-spacing="3" fill="#8de0cb">A FIELD GUIDE TO SEMICONDUCTORS</text>
  <text x="50" y="96" font-size="36" font-weight="700" letter-spacing="-1" fill="#f5f5ed">Small structures. An extraordinary journey.</text>
  <text x="50" y="126" font-size="17" fill="#b4c5ce">Learn what each stage makes, how it works, and why it is hard.</text>
  <g fill="#1b303e" stroke="#3a505d">
    <rect x="50" y="155" width="196" height="183" rx="12"/>
    <rect x="276" y="155" width="196" height="183" rx="12"/>
    <rect x="502" y="155" width="196" height="183" rx="12"/>
    <rect x="728" y="155" width="196" height="183" rx="12"/>
    <rect x="954" y="155" width="196" height="183" rx="12"/>
  </g>
  <g fill="#8da7b2" font-size="11" letter-spacing="1.5" font-weight="700">
    <text x="67" y="179">01 / MATERIALS</text><text x="293" y="179">02 / WAFERS</text>
    <text x="519" y="179">03 / DEVICES</text><text x="745" y="179">04 / PACKAGES</text>
    <text x="971" y="179">05 / SYSTEMS</text>
  </g>
  <g fill="none" stroke="#8da7b2" stroke-width="1.3" marker-end="url(#arrow)">
    <path d="M251 243h19"/><path d="M477 243h19"/><path d="M703 243h19"/><path d="M929 243h19"/>
  </g>
  <!-- Crystalline raw material: an illustrative faceted shape. -->
  <path d="M109 263l8-40 35-25 35 28 7 45-44 27z" fill="#2e7b78" stroke="#91d8cb" stroke-width="1.5"/>
  <path d="M117 223l33 16 37-13m-78 37 41-24 44 32m-44-73v41l0 59" fill="none" stroke="#91d8cb" stroke-width="1.5"/>
  <path d="M117 223l33 16v-41z" fill="#86c9b7" fill-opacity=".35"/>
  <!-- The grid represents die locations on a wafer. -->
  <circle cx="374" cy="242" r="52" fill="url(#wafer)" stroke="#99e2d6" stroke-width="1.5"/>
  <g clip-path="url(#wafer-cut)" stroke="#153e53" stroke-width="1.4" fill="none">
    <path d="M322 206h104M322 224h104M322 242h104M322 260h104M322 278h104M338 190v104M356 190v104M374 190v104M392 190v104M410 190v104"/>
  </g>
  <path d="M369 293l5-5 5 5" fill="#1b303e" stroke="#99e2d6"/>
  <!-- An abstract device-and-wiring motif, not a physical cross-section. -->
  <rect x="550" y="206" width="100" height="78" rx="6" fill="#203d4a" stroke="#7fd0c8" stroke-width="1.5"/>
  <g fill="none" stroke="#b7a4ec" stroke-width="3">
    <path d="M560 222h22v16h35v-23h22M560 265h30v-13h28v20h21"/>
  </g>
  <g fill="#efd193"><rect x="576" y="231" width="12" height="14" rx="2"/><rect x="612" y="245" width="12" height="14" rx="2"/></g>
  <g stroke="#7fd0c8" stroke-width="2"><path d="M564 200v6m18-6v6m18-6v6m18-6v6m18-6v6M564 284v6m18-6v6m18-6v6m18-6v6m18-6v6"/></g>
  <!-- Multiple dies integrated on a shared package. -->
  <path d="M764 268l64-22 61 21-64 23z" fill="#446a7a" stroke="#8bb4c1"/>
  <path d="M764 268v12l61 23 64-24v-12l-64 23z" fill="#284957" stroke="#8bb4c1"/>
  <path d="M794 239l31-11 31 11-31 12z" fill="#bc9ddd" stroke="#d8c4f1"/>
  <path d="M794 239v18l31 12 31-12v-18l-31 12z" fill="#725699" stroke="#d8c4f1"/>
  <g fill="#93d5c5" stroke="#bce9dc"><path d="M775 236l15-5 12 5-15 5zM849 262l15-5 12 5-15 5z"/><path d="M775 236v13l12 5 15-5v-13l-15 5zM849 262v13l12 5 15-5v-13l-15 5z" fill="#467d74"/></g>
  <!-- Computing system cabinets. -->
  <g fill="#233e4b" stroke="#84b6c3" stroke-width="1.5"><rect x="1008" y="199" width="40" height="99" rx="4"/><rect x="1056" y="199" width="40" height="99" rx="4"/></g>
  <g fill="#416171"><rect x="1014" y="209" width="28" height="14" rx="2"/><rect x="1014" y="230" width="28" height="14" rx="2"/><rect x="1014" y="251" width="28" height="14" rx="2"/><rect x="1014" y="272" width="28" height="14" rx="2"/><rect x="1062" y="209" width="28" height="14" rx="2"/><rect x="1062" y="230" width="28" height="14" rx="2"/><rect x="1062" y="251" width="28" height="14" rx="2"/><rect x="1062" y="272" width="28" height="14" rx="2"/></g>
  <g fill="#98e1c4"><circle cx="1036" cy="216" r="2"/><circle cx="1036" cy="237" r="2"/><circle cx="1036" cy="258" r="2"/><circle cx="1036" cy="279" r="2"/><circle cx="1084" cy="216" r="2"/><circle cx="1084" cy="237" r="2"/><circle cx="1084" cy="258" r="2"/><circle cx="1084" cy="279" r="2"/></g>
  <g fill="#f5f5ed" font-size="14" text-anchor="middle"><text x="148" y="322">Purify &amp; grow</text><text x="374" y="322">Slice &amp; prepare</text><text x="600" y="322">Pattern &amp; connect</text><text x="826" y="322">Integrate &amp; protect</text><text x="1052" y="322">Compute &amp; coordinate</text></g>
  <path d="M50 369h1100" stroke="#39505b"/>
  <text x="50" y="405" font-size="17" fill="#f1d69e" font-weight="700">10 survey chapters</text>
  <text x="235" y="405" font-size="16" fill="#b4c5ce">Build the mental model</text>
  <text x="655" y="405" font-size="17" fill="#b9ace1" font-weight="700">22 deep-dive modules</text>
  <text x="862" y="405" font-size="16" fill="#b4c5ce">Follow the mechanisms</text>
</g>
</svg>
